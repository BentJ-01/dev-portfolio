name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            wie-van-ons/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Build "Wie van ons?"
        working-directory: wie-van-ons
        # Publieke waarden (ze belanden toch in de frontend); repo-secrets overschrijven ze.
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://msthvtrwwddjeouznnhx.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1zdGh2dHJ3d2RkamVvdXpubmh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NzAyOTIsImV4cCI6MjEwNjU0NjI5Mn0.OhSLVTXZE7ddhAD5lD-QFYGDc6VpNpI3jygOw8xgyA0' }}
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/wie-van-ons
          cp -r dist/. ../dist/wie-van-ons/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
