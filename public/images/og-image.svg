<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ede1"/>
      <stop offset="1" stop-color="#faf7ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43663c"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- monogram -->
  <rect x="80" y="80" width="92" height="92" rx="20" fill="url(#accent)"/>
  <text x="126" y="142" text-anchor="middle"
    font-family="'Space Grotesk', system-ui, sans-serif" font-size="46" font-weight="700"
    fill="#f7f4ea">BJ</text>

  <text x="80" y="330" font-family="'Space Grotesk', system-ui, sans-serif"
